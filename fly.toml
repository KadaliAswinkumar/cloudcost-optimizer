# Fly.io Configuration for CloudCost Optimizer
# Free tier: 3 shared-cpu-1x VMs with 256MB RAM each

app = "cloudcost-optimizer"
primary_region = "iad"  # Ashburn, Virginia (close to many users)

[build]
  dockerfile = "Dockerfile.fly"

[env]
  PORT = "8080"
  PYTHONUNBUFFERED = "1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0  # Scale to zero when idle (FREE!)
  processes = ["app"]

[[http_service.checks]]
  interval = "15s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256  # Free tier

[deploy]
  strategy = "immediate"
