<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CloudCost Optimizer</title>
  <script>
    // GitHub Pages SPA redirect workaround
    // When a user navigates directly to a route (e.g., /instances), GitHub Pages
    // returns this 404.html. We redirect to index.html with the path as a query parameter.
    // The React app will read this parameter and navigate to the correct route.
    
    var pathSegmentsToKeep = 1; // For repo pages (username.github.io/repo-name/)
    
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body>
</body>
</html>
