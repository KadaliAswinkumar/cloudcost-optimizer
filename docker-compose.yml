version: '3.8'

services:
  # FastAPI Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloudcost-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/cloudcost
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - AWS_ACCESS_KEY_ID=AKIASOVOVV6I4EGP5VYA
      - AWS_SECRET_ACCESS_KEY=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
      - AWS_DEFAULT_REGION=us-east-1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - cloudcost-network

  # Celery Worker
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloudcost-celery-worker
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/cloudcost
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - AWS_ACCESS_KEY_ID=AKIASOVOVV6I4EGP5VYA
      - AWS_SECRET_ACCESS_KEY=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
      - AWS_DEFAULT_REGION=us-east-1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src
    command: celery -A src.jobs.celery_app worker --loglevel=info
    networks:
      - cloudcost-network

  # Celery Beat Scheduler
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloudcost-celery-beat
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/cloudcost
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src
    command: celery -A src.jobs.celery_app beat --loglevel=info
    networks:
      - cloudcost-network

  # Flower - Celery Monitoring
  flower:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloudcost-flower
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/1
    depends_on:
      - redis
      - celery-worker
    command: celery -A src.jobs.celery_app flower --port=5555
    networks:
      - cloudcost-network

  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: cloudcost-db
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=cloudcost
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cloudcost-network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: cloudcost-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes
    networks:
      - cloudcost-network

volumes:
  postgres_data:
  redis_data:

networks:
  cloudcost-network:
    driver: bridge

