# Render.com deployment configuration for CloudCost Optimizer Backend
services:
  # FastAPI Backend API
  - type: web
    name: cloudcost-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    # Auto-load real data on deployment
    preDeployCommand: python fetch_real_data.py || echo "Data fetch failed, continuing..."
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cloudcost-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: false
      - key: ALLOWED_ORIGINS
        value: https://kadaliaswinkumar.github.io

databases:
  # PostgreSQL Database (Free tier)
  - name: cloudcost-db
    databaseName: cloudcost
    user: cloudcost
    plan: free
