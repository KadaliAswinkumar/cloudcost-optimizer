services:
  # Main API Service
  - type: web
    name: cloudcost-api
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "alembic upgrade head && (python scripts/fetch_real_data.py || echo '⚠️  Data fetch failed') && (python scripts/fetch_real_spot_pricing.py || echo '⚠️  Spot pricing failed') && (python scripts/add_reserved_pricing.py || echo '⚠️  Reserved pricing failed') && uvicorn src.api.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: cloudcost-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false

  # Weekly Spot Price Collection Job
  - type: cron
    name: spot-price-collector
    env: python
    schedule: "0 0 * * 0"  # Every Sunday at midnight UTC (Weekly)
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python scripts/collect_spot_prices_hourly.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: cloudcost-db
          property: connectionString
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false

databases:
  - name: cloudcost-db
    databaseName: cloudcost
    user: cloudcost
