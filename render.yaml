# Render Blueprint for CloudCost Optimizer
# This file enables one-click deployment on Render
# https://render.com/docs/blueprint-spec

services:
  # Backend API
  - type: web
    name: cloudcost-api
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn src.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cloudcost-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: CORS_ORIGINS
        value: http://localhost:5174,http://localhost:5173,http://localhost:3000

  # Frontend Static Site
  - type: web
    name: cloudcost-app
    runtime: static
    plan: free
    branch: main
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://cloudcost-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Spot Price Collector (Runs once a month - super cheap!)
  - type: cron
    name: spot-price-collector
    runtime: python
    plan: free
    region: oregon
    branch: main
    schedule: "0 2 1 * *"
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python scripts/fetch_real_spot_pricing.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cloudcost-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: AWS_REGION
        value: us-east-1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false

databases:
  # PostgreSQL Database
  - name: cloudcost-db
    plan: free
    databaseName: cloudcost
    user: cloudcost_user
    region: oregon
