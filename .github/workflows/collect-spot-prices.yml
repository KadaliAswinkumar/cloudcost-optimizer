name: Collect Spot Prices (Weekly)

on:
  schedule:
    # Run every Sunday at midnight UTC (Weekly)
    - cron: '0 0 * * 0'
  
  workflow_dispatch:  # Allow manual trigger

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Collect spot prices
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          echo "🚀 Starting spot price collection..."
          python scripts/collect_spot_prices_hourly.py
      
      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Spot price collection failed!"
          echo "Check logs for details."
