# Deploy Vite frontend to GitHub Pages (project site: /cloudcost-optimizer/).
# Repo → Settings → Pages → Build: GitHub Actions.
# Optional: Settings → Variables → Actions → VITE_API_URL (override Render API URL).
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
          
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
          
      - name: Build
        env:
          # Repository variable VITE_API_URL overrides; else your live Render API
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          cd frontend
          export VITE_API_URL="${VITE_API_URL:-https://cloudcost-api-3uy5.onrender.com}"
          npm run build
          # SPA: GitHub Pages serves 404.html for unknown paths (already in public/)
          test -f dist/404.html || cp dist/index.html dist/404.html
          
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
